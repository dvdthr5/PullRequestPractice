name: CI and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check website files and links
        run: python3 scripts/validate.py
      - name: Check the validator's failure cases
        run: python3 -m unittest discover -s tests -v

  deploy:
    name: Deploy to GitHub Pages
    # PRs run CI only. Publish main only after validation succeeds.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Collect the website files
        run: |
          mkdir -p _site
          cp index.html styles.css _site/
          cp -R students _site/students
      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy the website
        id: deployment
        uses: actions/deploy-pages@v4
